# Verification gate for every pull request. It runs `task ci` in the same Docker image
# as a local `task ci`, so a failure here reproduces on any machine with Docker and go-task.
# Linux only: macOS runners are not free for this private repository.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: linux (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: onward-generator:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: task ci
        run: task ci

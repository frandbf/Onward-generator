# Verification gate for every pull request. It runs `task ci` in the same Docker image
# as a local `task ci`, so a failure here reproduces on any machine with Docker and go-task.
# Linux only: macOS runners are not free for this private repository.
# `mutate` (pull requests and manual runs) mutates only the functions the change touched (tools/mutate/run.py) and fails
# when a mutant survives, i.e. when no test notices the changed behaviour. Before that,
# `task guard` fails when the same change edits src/ and a quality gate.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: linux (docker)
    runs-on: ubuntu-latest
    # About four times the measured p90 (1.5 min).
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: onward-generator:dev
          cache-from: type=gha
          # Pull requests read the cache; only main writes it.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
      - name: task ci
        run: task ci

  mutate:
    name: mutate (changed functions)
    # Pull requests only: a fork PR is rebased on main and mutated before it is
    # rebase-merged, so the push to main carries the same tree and would repeat it.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # Measured 9-13 min with source changes; well under 1 min without.
    timeout-minutes: 30
    env:
      BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The check still reports when nothing in src/ changed; it just skips the image build and mutmut.
      - name: Changed source
        id: changes
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$(git merge-base "$BASE" HEAD)" HEAD -- src/onward_generator; then
            echo "src=false" >> "$GITHUB_OUTPUT"
            echo "No change under src/onward_generator since $BASE: nothing to mutate." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "src=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: arduino/setup-task@v3
        if: steps.changes.outputs.src == 'true'
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        if: steps.changes.outputs.src == 'true'
      - name: Build image
        if: steps.changes.outputs.src == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: onward-generator:dev
          cache-from: type=gha
          # Pull requests read the cache; only main writes it.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
      # A change to src/ must not also loosen a gate; see AGENTS.md, Quality gates.
      - name: task guard
        if: steps.changes.outputs.src == 'true' && github.event_name == 'pull_request'
        env:
          GUARD_BASE_REF: ${{ steps.changes.outputs.base }}
        run: task guard BASE="$GUARD_BASE_REF"
      - name: task mutate
        if: steps.changes.outputs.src == 'true'
        env:
          MUTATE_BASE_REF: ${{ steps.changes.outputs.base }}
        run: task mutate BASE="$MUTATE_BASE_REF"

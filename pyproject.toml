[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "onward-generator"
version = "0.1.0"
description = "Local, AI-assisted 3D map generator from legal geographic data, initially targeting Onward custom maps."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "shapely==2.2.0",
    "pyproj==3.8.0",
    "jsonschema==4.26.0",
    "pillow==11.3.0",
    "numpy==2.5.4",
    "certifi==2026.10.18",
    "duckdb==1.5.6",
]

[project.scripts]
onward-generator = "onward_generator.cli:main"

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.mutmut]
# task mutate (tools/mutate/run.py) passes the changed functions; this is the copy mutmut tests against.
source_paths = ["src/"]
also_copy = ["config/", "assets/", "tests/", "tools/", "docs/", ".githooks/", "requirements.lock", "requirements-mutate.lock", "requirements-lint.lock", "README.md"]
mutate_only_covered_lines = true

[tool.ruff]
# task lint. Line length is not enforced: the code was never formatted to one, and reformatting it all would bury real changes.
target-version = "py312"
line-length = 140  # only how isort wraps imports; E501 is off
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PGH003", "PGH004", "RUF100"]
ignore = [
    "E501",  # see above
    "B905",  # zip(strict=) changes behaviour; add it where a length mismatch is a bug, with a test
]
# Codes from rules this config does not enable, kept on lines that document why the pattern is deliberate.
external = ["BLE001", "N802", "PLR0124", "S310"]

[tool.ruff.lint.isort]
known-first-party = ["onward_generator", "tests"]

[tool.mypy]
# task typecheck. Errors that existed when mypy was added are listed in mypy-baseline.txt; only new ones fail.
python_version = "3.12"
files = ["src"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# No inline types. types-shapely would add about 1100 errors; adopt it in its own change.
module = ["shapely", "shapely.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

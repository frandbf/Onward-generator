# Optional. See README "Docker (optional)". Use tools/docker/run.sh rather than calling this directly.
services:
  dev:
    build:
      context: .
      # tools/docker/inputs.sh, set by run.sh: run.sh rebuilds when the hash no longer matches.
      labels:
        org.onward-generator.inputs: "${ONWARD_IMAGE_INPUTS:-}"
    # tools/docker/image.sh: onward-generator:dev, or dev-<folder> in a linked git worktree.
    image: ${ONWARD_IMAGE:-onward-generator:dev}
    working_dir: /work
    volumes:
      - .:/work
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Passed through so tools can tell a CI runner from a workstation (task mutate --jobs).
    # git refuses a repository whose files another user owns ("dubious ownership"), and a repository
    # on an external macOS volume shows another owner inside the container: task guard and task mutate
    # then failed before checking anything. Trust the mounted repositories, and only inside the container;
    # "*" also covers the main .git that run.sh mounts at its own path for a worktree.
    environment:
      - CI
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=*
    # Host network so the pipeline reaches loopback Ollama (127.0.0.1:11434) as it does natively on Linux.
    # On macOS 127.0.0.1 is Docker Desktop's VM: run.sh sets ONWARD_OLLAMA_HOST to host.docker.internal.
    network_mode: host

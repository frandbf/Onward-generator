# Optional. See README "Docker (optional)". Use tools/docker/run.sh rather than calling this directly.
services:
  dev:
    build:
      context: .
      # tools/docker/inputs.sh, set by run.sh: run.sh rebuilds when the hash no longer matches.
      labels:
        org.onward-generator.inputs: "${ONWARD_IMAGE_INPUTS:-}"
    # tools/docker/image.sh: onward-generator:dev, or dev-<folder> in a linked git worktree.
    image: ${ONWARD_IMAGE:-onward-generator:dev}
    working_dir: /work
    volumes:
      - .:/work
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Passed through so tools can tell a CI runner from a workstation (task mutate --jobs).
    environment:
      - CI
    # Host network so the pipeline reaches loopback Ollama (127.0.0.1:11434) as it does natively.
    network_mode: host
